<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Deployment Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 50px;
            color: #00ff99;
        }

        h2 {
            color: #ffd700;
        }

        p {
            font-size: 20px;
        }

        .success {
            margin-top: 30px;
            display: inline-block;
            background: #28a745;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        footer {
            margin-top: 80px;
            color: #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Jenkins Deployment Successful!</h1>
    <h2>DevOps CI/CD Pipeline Test</h2>

    <p>This application was deployed using <strong>Jenkins</strong>.</p>
    <p>Server Status: <span style="color:lime;">Running</span></p>

    <div class="success">
        ✅ Build & Deployment Completed Successfully
    </div>
</div>

<footer>
    <p>Deployment Time:
        <script>
            document.write(new Date().toLocaleString());
        </script>
    </p>
</footer>

</body>
</html>
